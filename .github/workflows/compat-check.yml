name: Compatibility Check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

env:
  WASM_BINDGEN_VERSION: "0.2.105"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install

      - name: Setup rewriter toolchain
        uses: ./.github/actions/setup-rewriter-toolchain
        with:
          wasm-bindgen-version: ${{ env.WASM_BINDGEN_VERSION }}
          rewriter-path: packages/core/rewriter
          github-token: ${{ github.token }}

      - name: Build rewriter WASM
        run: pnpm rewriter:build
        working-directory: packages/core

      - name: Build core
        run: pnpm build
        working-directory: packages/core

      - name: Build controller
        run: pnpm build
        working-directory: packages/controller

      - name: Build utils
        run: pnpm build
        working-directory: packages/utils

      - name: Build demo
        run: pnpm build
        working-directory: packages/demo

      - name: Publish Render deployment branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/scramjet-render
          mkdir -p /tmp/scramjet-render/public
          cp -R packages/demo/dist/. /tmp/scramjet-render/public/
          cp render/server.mjs /tmp/scramjet-render/server.mjs
          cat > /tmp/scramjet-render/package.json <<'JSON'
          {
            "name": "scramjet-v2-render",
            "private": true,
            "type": "module",
            "engines": {
              "node": "22.x"
            },
            "dependencies": {
              "@mercuryworkshop/wisp-js": "0.4.1"
            },
            "scripts": {
              "start": "node server.mjs"
            }
          }
          JSON

          cd /tmp/scramjet-render
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b render-deploy
          git add -A
          git commit -m "Render deployment for ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin render-deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}
