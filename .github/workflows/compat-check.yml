name: Compatibility Check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

concurrency:
  group: scramjet-v2-${{ github.ref }}
  cancel-in-progress: true

env:
  WASM_BINDGEN_VERSION: "0.2.105"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install

      - name: Setup rewriter toolchain
        uses: ./.github/actions/setup-rewriter-toolchain
        with:
          wasm-bindgen-version: ${{ env.WASM_BINDGEN_VERSION }}
          rewriter-path: packages/core/rewriter
          github-token: ${{ github.token }}

      - name: Build rewriter WASM
        run: pnpm rewriter:build
        working-directory: packages/core

      - name: Build core
        run: pnpm build
        working-directory: packages/core

      - name: Benchmark rewrite cache
        continue-on-error: true
        run: node benchmarks/rewrite-cache.mjs

      - name: Build controller
        run: pnpm build
        working-directory: packages/controller

      - name: Build utils
        run: pnpm build
        working-directory: packages/utils

      - name: Build demo
        run: pnpm build
        working-directory: packages/demo

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
        working-directory: packages/runway

      - name: Media range regression test
        run: OMIT_WPT=1 RUNWAY_FAST=1 pnpm test http-range-requests
        working-directory: packages/runway

      - name: YouTube compatibility smoke test
        continue-on-error: true
        run: OMIT_WPT=1 RUNWAY_FAST=1 pnpm test site-youtube
        working-directory: packages/runway

      - name: Publish Render deployment branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/scramjet-render
          mkdir -p /tmp/scramjet-render/public
          cp -R packages/demo/dist/. /tmp/scramjet-render/public/
          cp render/server.mjs /tmp/scramjet-render/server.mjs

          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          import zlib from "node:zlib";

          const root = "/tmp/scramjet-render/public";
          const compressible = new Set([
            ".html", ".js", ".mjs", ".css", ".json", ".svg", ".wasm", ".map"
          ]);

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                walk(full);
                continue;
              }
              const ext = path.extname(entry.name).toLowerCase();
              if (!compressible.has(ext)) continue;
              const data = fs.readFileSync(full);
              if (data.length < 1024) continue;

              fs.writeFileSync(
                full + ".br",
                zlib.brotliCompressSync(data, {
                  params: {
                    [zlib.constants.BROTLI_PARAM_QUALITY]: 9
                  }
                })
              );
              fs.writeFileSync(full + ".gz", zlib.gzipSync(data, { level: 9 }));
            }
          }

          walk(root);
          NODE
          cat > /tmp/scramjet-render/package.json <<'JSON'
          {
            "name": "scramjet-v2-render",
            "private": true,
            "type": "module",
            "engines": {
              "node": "22.x"
            },
            "dependencies": {
              "@mercuryworkshop/wisp-js": "0.5.0"
            },
            "scripts": {
              "start": "node server.mjs"
            }
          }
          JSON

          cd /tmp/scramjet-render
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b render-deploy
          git add -A
          git commit -m "Render deployment for ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin render-deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}
